<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音无水印下载</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-47C29C0P6D"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-47C29C0P6D');
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0F0F0F;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #25F4EE, #FE2C55);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 32px; }
        .container {
            width: 100%;
            max-width: 720px;
        }
        .input-area {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #25F4EE; }
        input[type="text"]::placeholder { color: #555; }
        button {
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            background: #FE2C55;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        button:hover { background: #e0204d; }
        button:active { transform: scale(0.97); }
        button:disabled { background: #555; cursor: not-allowed; transform: none; }
        .result { display: none; }
        .result.show { display: block; }
        .meta {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .meta h3 { font-size: 1rem; margin-bottom: 6px; color: #fff; }
        .meta p { font-size: 0.85rem; color: #888; }
        .method-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            background: #1a2a3a;
            color: #25F4EE;
            margin-top: 8px;
        }
        .video-section { margin-bottom: 16px; }
        .video-section video {
            width: 100%;
            border-radius: 10px;
            background: #000;
            max-height: 500px;
        }
        .download-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #25F4EE;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .download-btn:hover { background: #252525; }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .image-card {
            border-radius: 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            overflow: hidden;
        }
        .image-card .img-wrap {
            position: relative;
            overflow: hidden;
        }
        @supports (aspect-ratio: 1) {
            .image-card .img-wrap { aspect-ratio: 3/4; }
        }
        @supports not (aspect-ratio: 1) {
            .image-card .img-wrap::before {
                content: '';
                display: block;
                padding-top: 133.33%;
            }
        }
        .image-card img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .image-card img.loaded { opacity: 1; }
        .image-card .loader-wrap {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .image-card .loader {
            width: 32px;
            height: 32px;
            border: 3px solid #333;
            border-top-color: #FE2C55;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .image-card .loader-wrap.hidden { opacity: 0; }
        .image-card .dl {
            display: block;
            width: 100%;
            text-align: center;
            padding: 10px;
            background: none;
            border: none;
            color: #25F4EE;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .image-card .dl:hover { background: #252525; }
        .error {
            display: none;
            background: #2a1515;
            border: 1px solid #6a2020;
            border-radius: 10px;
            padding: 16px;
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .error.show { display: block; }
        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid #333;
            border-top-color: #FE2C55;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        .spinner.show { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { text-align: center; color: #888; margin: 32px 0; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>抖音无水印下载</h1>
    <p class="subtitle">粘贴分享链接，获取无水印视频/图片</p>

    <div class="container">
        <div class="input-area">
            <input type="text" id="urlInput" placeholder="粘贴抖音分享链接或完整 URL" autocomplete="off">
            <button id="submitBtn" onclick="parse()">解析</button>
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="meta" id="meta"></div>
            <div id="mediaContent"></div>
        </div>

        <div class="loading-text" id="loading" style="display:none;">
            <div class="spinner show"></div>
            <div style="margin-top:12px;">正在解析，请稍候...</div>
        </div>
    </div>

    <script>
        const input = document.getElementById('urlInput');
        input.addEventListener('keydown', e => { if (e.key === 'Enter') parse(); });

        async function parse() {
            const url = input.value.trim();
            if (!url) return;

            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');
            const loadingEl = document.getElementById('loading');
            const btn = document.getElementById('submitBtn');

            errorEl.classList.remove('show');
            resultEl.classList.remove('show');
            loadingEl.style.display = 'block';
            btn.disabled = true;

            try {
                const resp = await fetch('./api/parse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url }),
                });
                const data = await resp.json();

                if (!resp.ok || !data.success) {
                    throw new Error(data.detail || data.error || '解析失败');
                }

                renderResult(data.data, data.method);
            } catch (e) {
                errorEl.textContent = e.message;
                errorEl.classList.add('show');
            } finally {
                loadingEl.style.display = 'none';
                btn.disabled = false;
            }
        }

        function renderResult(data, method) {
            const metaEl = document.getElementById('meta');
            const mediaEl = document.getElementById('mediaContent');
            const resultEl = document.getElementById('result');

            let metaHTML = `<h3>${escapeHtml(data.title || '抖音作品')}</h3>`;
            if (data.author) metaHTML += `<p>作者: ${escapeHtml(data.author)}</p>`;
            if (data.desc) metaHTML += `<p style="margin-top:6px;max-height:60px;overflow:hidden;">${escapeHtml(data.desc)}</p>`;
            metaHTML += `<span class="method-badge">来源: ${escapeHtml(method)}</span>`;
            metaEl.innerHTML = metaHTML;

            if (data.type === 'video' && data.video_url) {
                mediaEl.innerHTML = `
                    <div class="video-section">
                        <video controls preload="metadata" poster="${data.cover ? escapeAttr(data.cover) : ''}">
                            <source src="${escapeAttr(data.video_url)}" type="video/mp4">
                            浏览器不支持视频播放
                        </video>
                        <a class="download-btn" href="${escapeAttr(data.video_url)}" target="_blank" rel="noopener">
                            ⬇ 下载无水印视频
                        </a>
                    </div>
                `;
            } else if (data.images && data.images.length > 0) {
                let gridHTML = '<div class="image-grid">';
                data.images.forEach((imgUrl, i) => {
                    const safeUrl = imgUrl.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                    gridHTML += `
                        <div class="image-card">
                            <div class="img-wrap">
                                <div class="loader-wrap" id="loader-${i}">
                                    <div class="loader"></div>
                                </div>
                                <img alt="图片 ${i + 1}" src="${safeUrl}" data-index="${i}">
                            </div>
                            <a class="dl" href="${safeUrl}" target="_blank" rel="noopener">
                                ⬇ 下载原图 ${i + 1}
                            </a>
                        </div>
                    `;
                });
                gridHTML += '</div>';
                mediaEl.innerHTML = gridHTML;

                // 图片加载完成隐藏 loader
                mediaEl.querySelectorAll('.image-card img').forEach(img => {
                    const idx = img.dataset.index;
                    const loader = document.getElementById('loader-' + idx);
                    img.onload = () => {
                        img.classList.add('loaded');
                        loader.classList.add('hidden');
                    };
                    img.onerror = () => {
                        loader.classList.add('hidden');
                        img.alt = '加载失败';
                    };
                });
            }

            resultEl.classList.add('show');
        }

        function escapeHtml(s) {
            if (!s) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function escapeAttr(s) {
            if (!s) return '';
            return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>
</html>
